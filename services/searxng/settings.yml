# Local SearXNG for OpenClaw deep research. Bound to 127.0.0.1 only (see scripts/start-searxng.ps1).
# The secret key comes from the SEARXNG_SECRET environment variable of the container, not from this file.
use_default_settings: true

general:
  instance_name: "local-research"

server:
  limiter: false          # single local user; the limiter needs Redis
  image_proxy: false
  public_instance: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json                # the MCP server reads JSON results

ui:
  default_theme: simple

# Engines (2026-10-20): with the defaults often only Bing answers from a home IP - Google "access denied", Brave /
# Wikipedia rate-limited, DuckDuckGo CAPTCHA. Enable more independent web indexes; SearXNG suspends a blocked one by
# itself and the others carry on. For reliable results set TAVILY_API_KEY (skills/deep-research).
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: yahoo
    disabled: false
  - name: yandex
    disabled: false
  - name: marginalia
    disabled: false
  - name: seznam
    disabled: false
  - name: swisscows
    disabled: false
  - name: dogpile
    disabled: false
